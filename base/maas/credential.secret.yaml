---
# Credential for the Part-A ExternalModel. The MaaS gateway injects this as the Authorization
# header when routing to NeMo. NeMo then FORWARDS it to the remote main model via header
# forwarding — so this must be a valid token for the remote MaaS endpoint, NOT a dummy.
# The real value is set via the overlay secretGenerator (nemo-remote.secret.env, key: api-key).
apiVersion: v1
kind: Secret
metadata:
  name: llama-4-scout-cred
  namespace: nemo-guardrails
  labels:
    inference.llm-d.ai/ipp-managed: "true"
type: Opaque
stringData:
  api-key: "REPLACE_ME"
