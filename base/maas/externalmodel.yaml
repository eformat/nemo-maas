---
# Part A/C on the praxis path — the AGC inference schema (inference.opendatahub.io).
# ai-gateway-controller (watching inference.opendatahub.io) reconciles this ExternalModel
# and creates the external-model routes, provider transport and credential injection on
# the praxis dataplane. The maas.opendatahub.io CRD this file previously targeted is the
# 3.5/IPP-era schema and is not reconciled on the praxis path (CRD mismatch).
#
# The client-facing model name defaults to metadata.name: llama-4-scout-17b-16e-w4a16 —
# which must equal the NemoGuardrails config name (NeMo's chat handler uses the request
# body model for its config lookup AND the outbound LLM call).
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: llama-4-scout-17b-16e-w4a16
  namespace: nemo-guardrails
spec:
  # gatewayRefs: an EXPLICIT gateway attachment. The deployed ai-gateway-controller build
  # predates the default-tenant flow (#172) and silently skips models in namespaces with no
  # MaasTenantConfig (nemo-guardrails has none) — an explicit gatewayRefs attaches this model
  # to the default tenant's Gateway (praxis-selected) regardless of the model namespace.
  gatewayRefs:
    - name: maas-default-gateway
      namespace: openshift-ingress
  externalProviderRefs:
    - ref:
        name: nemo-chat
        namespace: nemo-guardrails
      targetModel: llama-4-scout-17b-16e-w4a16
      apiFormat: openai-chat
      # The outgoing request :path to NeMo's chat proxy.
      path: /v1/chat/completions
  # gatewayRefs omitted: nemo-guardrails has no MaasTenantConfig, so the default
  # tenant's Gateway serves the model — the default tenant is praxis-selected.
